name: Deploy to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/build.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    # A healthy multi-arch build finishes in ~4 minutes; anything longer is a
    # hung runner. Fail fast instead of holding :latest hostage for 6 hours.
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required to count commits since VERSION last changed

      # MAJOR.MINOR come from the repo-root VERSION file; PATCH auto-bumps by
      # the number of commits since VERSION was last touched. Bump VERSION to
      # start a new MINOR/MAJOR series.
      - name: Resolve version
        id: v
        run: |
          IFS=. read -r MAJOR MINOR BASE_PATCH <<< "$(tr -d '[:space:]' < VERSION)"
          VERSION_SHA="$(git log -n 1 --format=%H -- VERSION)"
          SINCE="$(git rev-list --count "${VERSION_SHA}..HEAD")"
          echo "tag=${MAJOR}.${MINOR}.$(( BASE_PATCH + SINCE ))" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent so re-running a failed/cancelled job doesn't die on an
          # already-pushed tag; -f only ever re-points a tag for this commit's
          # own version number.
          git tag -f v${{ steps.v.outputs.tag }}
          git push -f origin v${{ steps.v.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies and build frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
