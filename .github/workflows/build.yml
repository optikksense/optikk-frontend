name: Build and Test

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Corepack (Yarn from packageManager)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # type-check, lint, the architecture checks, tests and build. The wire
      # contract tests parse fixtures generated from query's real Go response
      # structs — see src/shared/api/utils/contract.test.ts.
      - name: Checks
        run: yarn ci

      - name: Container smoke test
        run: |
          docker build --tag optikk-web:ci .
          docker run --detach --rm --name optikk-web-smoke \
            --env BACKEND_URL=http://127.0.0.1:9 \
            --publish 18080:3000 \
            optikk-web:ci
          trap 'docker rm --force optikk-web-smoke >/dev/null 2>&1 || true' EXIT
          curl --retry 5 --retry-all-errors --retry-delay 1 \
            --fail --silent --show-error --head \
            http://127.0.0.1:18080/index.html > index-headers.txt
          grep --ignore-case --quiet '^Content-Security-Policy:' index-headers.txt
          grep --ignore-case --quiet '^X-Frame-Options: SAMEORIGIN' index-headers.txt
          grep --ignore-case --quiet \
            '^Cache-Control: no-store, no-cache, must-revalidate, max-age=0' \
            index-headers.txt

          asset_path="$(grep --only-matching --extended-regexp \
            '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head --lines=1)"
          curl --fail --silent --show-error --head \
            "http://127.0.0.1:18080${asset_path}" > asset-headers.txt
          grep --ignore-case --quiet \
            '^Cache-Control: public, immutable' \
            asset-headers.txt
