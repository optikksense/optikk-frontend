  <style>/* Optikk — Observability prototype tokens
 * Light-first to match the attached mockups; dark variant exposed via [data-theme="dark"].
 */

:root {
  /* Surfaces — subtle warm off-white, close to white */
  --bg-canvas: #faf8f4;
  --bg-sidebar: #f6f2ec;
  --bg-card: #fffefb;
  --bg-inset: #f6f2ec;
  --bg-hover: #efeae1;
  --bg-row-hover: #f7f4ee;

  /* Text — warm-tinted neutrals */
  --fg-0: #2a2520;
  --fg-1: #4d463d;
  --fg-2: #6b6357;
  --fg-3: #8f857a;
  --fg-mute: #aba093;

  /* Lines */
  --line: #ebe5d9;
  --line-2: #f2ede4;

  /* Brand */
  --brand: #2563eb;
  --brand-2: #3b82f6;
  --brand-soft: #dbeafe;
  --brand-tint: #eff6ff;
  --brand-deep: #1d4ed8;
  --brand-deepest: #1e3a8a;

  /* Status (semantic, calm) */
  --ok: #10b981;
  --ok-soft: #d1fae5;
  --warn: #eab308;
  --warn-soft: #fef3c7;
  --warn-fg: #92400e;
  --err: #ef4444;
  --err-soft: #fee2e2;
  --err-fg: #991b1b;
  --orange: #f97316;
  --accent-violet: #6366f1;
  --accent-violet-soft: #eef2ff;
  --accent-violet-2: #818cf8;

  /* Chart palette */
  --chart-1: #3b82f6;
  --chart-1-soft: #dbeafe;
  --chart-2: #6366f1;
  --chart-3: #10b981;
  --chart-4: #eab308;
  --chart-5: #ef4444;
  --chart-6: #f97316;

  /* Severity (logs/traces) */
  --sev-fatal: #b91c1c;
  --sev-error: #ef4444;
  --sev-warn:  #eab308;
  --sev-info:  #3b82f6;
  --sev-debug: #94a3b8;
  --sev-trace: #cbd5e1;

  /* Shadows (light) */
  --shadow-sm: 0 1px 2px rgba(74,55,35,0.05), 0 1px 1px rgba(74,55,35,0.04);
  --shadow-md: 0 8px 24px rgba(74,55,35,0.07), 0 2px 6px rgba(74,55,35,0.05);
  --shadow-lg: 0 24px 48px rgba(74,55,35,0.13), 0 8px 16px rgba(74,55,35,0.06);

  /* Radius */
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-xl: 12px;
  --r-pill: 999px;

  /* Spacing */
  --sidebar-w: 200px;
  --header-h: 58px;

  /* Typography */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace;
  --t-xs: 11px;
  --t-sm: 12px;
  --t-md: 13px;
  --t-lg: 14px;
  --t-xl: 15.5px;
  --t-2xl: 22px;
  --t-3xl: 26px;

  --label-tracking: 0.06em;
}

/* ===========================================================
 * DARK THEME
 * Original Optikk palette tuned for long-session comfort.
 * Principles:
 *  - Base is deep blue-charcoal (#0c0f14), never pure black — avoids
 *    OLED halation around white text and reduces contrast fatigue.
 *  - Foreground tops out at ~90% luminance off-white, not #fff —
 *    keeps WCAG AAA but cuts harshness.
 *  - Slate-tinted neutrals: tiny cool bias reads as "shadow",
 *    much more natural than pure gray.
 *  - Surfaces stack in ~3% luminance steps so depth reads without
 *    heavy borders.
 *  - Accents (brand / status) shifted lighter + slightly desaturated;
 *    saturated jewel tones look aggressive on dark.
 * ============================================================ */
[data-theme="dark"] {
  /* Surfaces — 4 steps of blue-charcoal */
  --bg-canvas:    #0c0f14;
  --bg-sidebar:   #0a0d12;
  --bg-card:      #131720;
  --bg-inset:     #1a1f2b;
  --bg-hover:     #1f2532;
  --bg-row-hover: #161a23;

  /* Text — off-white descending */
  --fg-0: #e6e8ec;
  --fg-1: #c2c7d1;
  --fg-2: #9aa3b2;
  --fg-3: #7a8294;
  --fg-mute: #565e6f;

  /* Lines — barely brighter than card */
  --line:   #232a39;
  --line-2: #1c2230;

  /* Brand — lifted blue for legibility on dark */
  --brand:        #3b82f6;
  --brand-2:      #60a5fa;
  --brand-soft:   rgba(59,130,246,0.18);
  --brand-tint:   rgba(59,130,246,0.10);
  --brand-deep:   #93c5fd;   /* "deep" inverts on dark — used as hover/link */
  --brand-deepest:#bfdbfe;

  /* Status — lighter + desaturated for comfort */
  --ok:       #34d399;
  --ok-soft:  rgba(52,211,153,0.16);
  --warn:     #fbbf24;
  --warn-soft:rgba(251,191,36,0.16);
  --warn-fg:  #fcd34d;
  --err:      #f87171;
  --err-soft: rgba(248,113,113,0.16);
  --err-fg:   #fca5a5;
  --orange:   #fb923c;
  --accent-violet:      #a78bfa;
  --accent-violet-soft: rgba(167,139,250,0.16);
  --accent-violet-2:    #c4b5fd;

  /* Chart palette — pre-lifted for dark backgrounds */
  --chart-1:      #60a5fa;
  --chart-1-soft: rgba(96,165,250,0.20);
  --chart-2:      #a78bfa;
  --chart-3:      #34d399;
  --chart-4:      #fbbf24;
  --chart-5:      #f87171;
  --chart-6:      #fb923c;

  /* Severity */
  --sev-fatal: #f87171;
  --sev-error: #f87171;
  --sev-warn:  #fbbf24;
  --sev-info:  #60a5fa;
  --sev-debug: #7a8294;
  --sev-trace: #565e6f;

  /* Shadows — barely-there, mostly inset glow */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.40), 0 0 0 1px rgba(255,255,255,0.02);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.30);
  --shadow-lg: 0 24px 48px rgba(0,0,0,0.55), 0 8px 16px rgba(0,0,0,0.35);

  /* Scheme hint so browser form widgets adopt dark */
  color-scheme: dark;
}

/* --- Dark mode adjustments for things that hardcode color or rely on
       light-only assumptions (focus rings, kbd shadow, ok badge text). --- */
[data-theme="dark"] .badge.ok       { color: #a7f3d0; }
[data-theme="dark"] .badge.err      { color: #fecaca; }
[data-theme="dark"] .badge.warn     { color: #fde68a; }
[data-theme="dark"] .badge.info     { color: #bfdbfe; }
[data-theme="dark"] .sev-chip.info  { color: #bfdbfe; }
[data-theme="dark"] .sev-chip.warn  { color: #fde68a; }
[data-theme="dark"] .sev-chip.fatal { background: #b91c1c; color: #fee2e2; }
[data-theme="dark"] .btn-primary    { color: #0c0f14; }
[data-theme="dark"] .btn-primary:hover { color: #0c0f14; }
[data-theme="dark"] .search:focus-within { box-shadow: 0 0 0 3px rgba(59,130,246,0.22); }
[data-theme="dark"] .kbd { background: var(--bg-inset); }
[data-theme="dark"] .tab.active { color: var(--brand-2); border-bottom-color: var(--brand-2); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--fg-0);
  background: var(--bg-canvas);
  font-size: var(--t-md);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: auto;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
input, select, textarea { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* =========== APP SHELL =========== */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  background: var(--bg-canvas);
  min-width: 1380px;
}

.sidebar {
  background: var(--bg-sidebar);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 0 12px;
  gap: 4px;
  overflow-y: auto;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px 22px;
  text-decoration: none;
  color: inherit;
}
.brand-mark {
  width: 26px; height: 26px; border-radius: 6px;
  display: block;
}
.brand-name { font-weight: 600; font-size: 15px; color: var(--fg-0); letter-spacing: -0.01em; }

.brand:hover .brand-name { color: var(--brand-deep); }

.crumbs a { cursor: pointer; }
.crumbs a:hover span { color: var(--fg-0) !important; }

a.nav-item { text-decoration: none; }

.nav-section { padding: 10px 14px 6px; font-size: 10px; color: var(--fg-mute); font-weight: 600; letter-spacing: 0.12em; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 7px 16px;
  margin: 0 8px;
  border-radius: 6px;
  color: var(--fg-2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 120ms, color 120ms;
}
.nav-item:hover { background: var(--bg-hover); color: var(--fg-0); }
.nav-item .nav-icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: currentColor; }
.nav-item.active { background: var(--bg-inset); color: var(--fg-0); font-weight: 600; }
.nav-spacer { flex: 1; }

/* =========== HEADER =========== */
.header {
  height: var(--header-h);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 24px;
  gap: 18px;
  background: var(--bg-canvas);
  position: sticky; top: 0; z-index: 10;
}
.header .crumbs { display: flex; align-items: center; gap: 6px; color: var(--fg-3); font-size: 13px; }
.header .crumbs .sep { color: var(--fg-mute); }
.time-pill {
  display: inline-flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 15px;
  background: var(--bg-card);
  font-size: 13px; color: var(--fg-0); font-weight: 500;
  cursor: pointer;
}
.time-pill:hover { border-color: var(--fg-mute); }
.live-pill {
  display: inline-flex; align-items: center; gap: 8px;
  height: 26px; padding: 0 12px; border-radius: 13px;
  border: 1px solid var(--ok); background: var(--bg-card);
  color: var(--ok); font-weight: 700; font-size: 12px;
  cursor: pointer;
}
.live-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in oklab, var(--ok) 24%, transparent); }
.live-pill.paused { color: var(--fg-3); border-color: var(--line); }
.live-pill.paused .dot { background: var(--fg-mute); box-shadow: none; }

.workspace-label { font-size: 10px; color: var(--fg-mute); font-weight: 600; letter-spacing: 0.12em; }
.workspace-val { font-size: 13px; color: var(--fg-0); font-weight: 500; }

.refresh-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--fg-0); font-weight: 500;
  padding: 6px 4px; cursor: pointer;
}

/* =========== MAIN =========== */
.main {
  overflow-y: auto;
  overflow-x: hidden;
  height: calc(100vh);
  display: flex; flex-direction: column;
}
.page {
  padding: 22px 30px 40px;
  display: flex; flex-direction: column; gap: 22px;
  min-width: 0;
}

/* =========== PAGE HEADER =========== */
.page-title-row { display: flex; align-items: center; gap: 16px; }
.page-icon {
  width: 40px; height: 40px; border-radius: 8px;
  background: var(--accent-violet-soft);
  display: flex; align-items: center; justify-content: center; color: var(--accent-violet);
}
.page-title { font-size: 24px; font-weight: 700; color: var(--fg-0); letter-spacing: -0.01em; }
.page-sub { font-size: 12.5px; color: var(--fg-3); margin-top: 2px; }
.spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--fg-1);
  font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
  white-space: nowrap;
}
.btn:hover { border-color: var(--fg-mute); color: var(--fg-0); background: var(--bg-inset); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: white; }
.btn-primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); color: white; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-icon { width: 30px; padding: 0; justify-content: center; }

/* Tabs (page-level) */
.tab-bar { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 0; }
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px 10px;
  font-size: 14px; font-weight: 500;
  color: var(--fg-2);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  margin-bottom: -1px;
}
.tab:hover { color: var(--fg-0); }
.tab.active { color: var(--brand-deep); border-bottom-color: var(--brand-deep); font-weight: 600; }

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 18px;
}
.card-pad-lg { padding: 22px 24px; }

.card-title { font-size: 14px; font-weight: 600; color: var(--fg-0); }
.card-sub { font-size: 12px; color: var(--fg-3); }

/* Badges & pills */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600;
}
.badge .b-dot { width: 6px; height: 6px; border-radius: 50%; }
.badge.err { background: var(--err-soft); color: var(--err-fg); }
.badge.err .b-dot { background: var(--err); }
.badge.warn { background: var(--warn-soft); color: var(--warn-fg); }
.badge.warn .b-dot { background: var(--warn); }
.badge.ok { background: var(--ok-soft); color: #065f46; }
.badge.ok .b-dot { background: var(--ok); }
.badge.neutral { background: var(--bg-inset); color: var(--fg-1); }
.badge.info { background: var(--brand-soft); color: var(--brand-deep); }
.badge.info .b-dot { background: var(--brand); }

.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--bg-card);
  font-family: var(--font-mono);
  font-size: 10.5px; color: var(--fg-2);
}

/* Mono */
.mono { font-family: var(--font-mono); }

/* Segmented control */
.seg {
  display: inline-flex;
  padding: 3px; gap: 0;
  background: var(--bg-inset);
  border-radius: 6px;
}
.seg-opt {
  padding: 4px 10px;
  font-size: 11.5px; font-weight: 600;
  color: var(--fg-3);
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
.seg-opt.active { background: var(--bg-card); color: var(--fg-0); box-shadow: var(--shadow-sm); }

/* Stat */
.stat-row { display: flex; align-items: baseline; gap: 8px; }
.stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg-0); }
.stat-value.lg { font-size: 32px; }
.stat-unit { font-size: 12.5px; color: var(--fg-3); }
.stat-label { font-size: 11px; color: var(--fg-mute); font-weight: 600; letter-spacing: var(--label-tracking); text-transform: uppercase; }
.delta { font-size: 11.5px; font-weight: 600; }
.delta.up { color: var(--ok); }
.delta.down { color: var(--err); }
.delta.warn { color: var(--warn-fg); }

/* Spark + sparkline */
.spark { display: block; }

/* Table */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-size: 10px; color: var(--fg-mute); font-weight: 600;
  letter-spacing: var(--label-tracking); text-transform: uppercase;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-2);
  background: transparent;
}
.tbl td {
  padding: 12px;
  border-bottom: 1px solid var(--line-2);
  color: var(--fg-1);
  vertical-align: middle;
}
.tbl tr:hover td { background: var(--bg-row-hover); }
.tbl tr:last-child td { border-bottom: 0; }

/* Healthy ring */
.ring {
  width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: conic-gradient(var(--ok) var(--p,75%), var(--bg-inset) 0);
  position: relative;
}
.ring::after {
  content: ""; position: absolute; inset: 4px;
  border-radius: 50%; background: var(--bg-card);
}
.ring > span { position: relative; font-size: 10.5px; font-weight: 700; color: var(--fg-0); }
.ring.warn { background: conic-gradient(var(--warn) var(--p,75%), var(--bg-inset) 0); }
.ring.err  { background: conic-gradient(var(--err)  var(--p,75%), var(--bg-inset) 0); }

/* Section label */
.label-up { font-size: 10px; color: var(--fg-mute); font-weight: 600; letter-spacing: var(--label-tracking); text-transform: uppercase; }

/* Inputs */
.search {
  display: inline-flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg-card);
}
.search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.search input { border: 0; outline: 0; background: transparent; flex: 1; font-size: 13px; color: var(--fg-0); }
.search input::placeholder { color: var(--fg-mute); }

/* Hex tile for the saturation grid */
.hex {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  color: white; font-weight: 700; font-size: 12px;
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
  width: 50px; height: 56px;
  position: relative;
}
.hex.sm { width: 38px; height: 42px; font-size: 11px; }
.hex small { font-weight: 600; font-size: 8px; opacity: 0.9; margin-top: 1px; }

/* Animated scan lines for live charts */
@keyframes pulse-dot {
  0%,100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 40%, transparent); }
  50%     { box-shadow: 0 0 0 6px color-mix(in oklab, var(--ok) 0%, transparent); }
}
.live-pill .dot { animation: pulse-dot 1.6s ease-in-out infinite; }

/* Severity row gutters (logs) */
.sev-gutter { width: 3px; border-radius: 2px; align-self: stretch; }
.sev-gutter.fatal { background: var(--sev-fatal); }
.sev-gutter.error { background: var(--sev-error); }
.sev-gutter.warn  { background: var(--sev-warn); }
.sev-gutter.info  { background: var(--sev-info); }
.sev-gutter.debug { background: var(--sev-debug); }
.sev-gutter.trace { background: var(--sev-trace); }

.sev-chip {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 1px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
  font-family: var(--font-mono);
  min-width: 44px;
}
.sev-chip.error { color: var(--err); background: var(--err-soft); }
.sev-chip.warn  { color: var(--warn-fg); background: var(--warn-soft); }
.sev-chip.info  { color: var(--brand-deep); background: var(--brand-soft); }
.sev-chip.debug { color: var(--fg-2); background: var(--bg-inset); }
.sev-chip.fatal { color: white; background: var(--sev-fatal); }

/* Waterfall span bar */
.span-row {
  display: grid;
  grid-template-columns: 28px minmax(260px, 1fr) 70px 1fr 90px;
  align-items: center;
  gap: 12px;
  padding: 7px 18px;
  border-bottom: 1px solid var(--line-2);
  font-size: 12.5px;
  cursor: pointer;
}
.span-row:hover { background: var(--bg-row-hover); }
.span-row.selected { background: var(--brand-tint); }
.span-bar { position: relative; height: 16px; background: var(--bg-inset); border-radius: 3px; overflow: hidden; }
.span-bar > .bar {
  position: absolute; top: 0; bottom: 0;
  border-radius: 3px;
}

/* Scrollbar polish */
.main::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 10px; height: 10px; }
.main::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
.main::-webkit-scrollbar-thumb:hover { background: var(--fg-mute); }

/* Tweaks panel overrides to align with our theme */
.tweaks-panel { font-family: var(--font); }

/* Utility */
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grid { display: grid; gap: 12px; }
.muted { color: var(--fg-3); }
.hairline { height: 1px; background: var(--line); }

  <script>
  /* Floating theme toggle — single source of truth is the documentElement[data-theme]

  (function(){

    function syncLabel(){
      var btn=document.getElementById("__theme-toggle");
      if(!btn) return;
      var lbl=btn.querySelector(".__label");
      if(lbl) lbl.textContent = current()==="light" ? "Light" : "Dark";

    function setTheme(t){
      document.documentElement.setAttribute("data-theme", t);
      try{
        var s=localStorage.getItem("optikk-tweaks");
        var obj=s?JSON.parse(s):{};
        obj.theme=t;
        localStorage.setItem("optikk-tweaks", JSON.stringify(obj));
      }catch(e){}
      window.dispatchEvent(new CustomEvent("optikk:themechange",{ detail:t }));
    }
    function mount(){
      if(document.getElementById("__theme-toggle")) return;
      var btn=document.createElement("button");
      btn.id="__theme-toggle";
      btn.title="Toggle theme";
      btn.setAttribute("aria-label","Toggle theme");
      btn.innerHTML='<span class="__dot"></span><span class="__label"></span>';
      btn.addEventListener("click", function(){ setTheme(current()==="dark"?"light":"dark"); });
      document.body.appendChild(btn);
      syncLabel();
      // Reflect theme changes made anywhere (Tweaks panel, other tabs) on the label.
      new MutationObserver(syncLabel).observe(document.documentElement,{ attributes:true, attributeFilter:["data-theme"] });
    }
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", mount); else mount();
  })();
  </script>
