limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=otlp:10m rate=100r/s;
map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 3000;
    server_name _;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss://*.optikk.in; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Backend proxy — API, OTLP ingestion, and Swagger docs
    # BACKEND_URL is the hostname of the backend container.
    # When running via Docker, set this to the query service URL
    # (default: http://query:19090).
    # Overridden at runtime via environment variable
    # -------------------------------------------------------------------------

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass         ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }

    location /otlp/ {
        limit_req zone=otlp burst=200 nodelay;
        limit_req_status 429;
        proxy_pass         ${BACKEND_URL}/otlp/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
    }

    location /swagger/ {
        proxy_pass         ${BACKEND_URL}/swagger/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # -------------------------------------------------------------------------
    location = /index.html {
        # `expires` preserves the server-level security headers. A nested
        # `add_header` block would replace them rather than inherit them.
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
    gzip_min_length 1024;
}
